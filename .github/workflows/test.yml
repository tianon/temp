name: 'test with: fromJSON'

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          json="$(jq -nc '{
            repository: "tianon/actions",
            ref: "refs/heads/main",
            path: "foo",
          }')"
          echo "json=$json" >> "$GITHUB_OUTPUT"
        id: json
      - uses: tianon/actions/checkout/composite@HEAD
        with: '${{ fromJSON(steps.json.outputs.json) }}'
      - run: |
          ls -lAFhR
